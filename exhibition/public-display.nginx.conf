worker_processes 1;
pid /tmp/sentrix-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $server_name zone=display:1m rate=60r/s;
    limit_conn_zone $server_name zone=upstream:1m;
    server {
        listen 127.0.0.1:5192;
        absolute_redirect off;
        sub_filter '<html lang="ko">' '<html lang="ko" data-sentrix-view="public">';
        sub_filter_once on;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        limit_req zone=display burst=100 nodelay;
        limit_conn upstream 32;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = / { return 302 /display; }
        location = /display-environment {
            rewrite ^ /api/v1/environments/1? break;
            proxy_pass http://127.0.0.1:5191;
        }
        location = /api/v1/environments/1/logs/volume {
            if ($arg_search != "") { return 403; }
            proxy_pass http://127.0.0.1:5191$uri?service=$arg_service&from=$arg_from&to=$arg_to&bucketSeconds=$arg_bucketSeconds;
        }
        # Only the single exhibition namespace and read-only observation routes are shared.
        location ~ "^/(display|display-policy|assets/[A-Za-z0-9_-]+\.(css|js|woff2)|api/v1/environments/1(/(overview|anomaly-scores|services|metrics|log-semantics/summary|monitoring|collection-status|traces(/[a-f0-9]{32})?|service-map|services/[a-z0-9-]+/(status|pods(/[a-z0-9-]+/metrics)?)|incidents(/[a-f0-9-]{36}(/rca|/rca-jobs(/[a-f0-9-]{36}(/result)?)?)?)?))?)$" {
            proxy_pass http://127.0.0.1:5191$uri$is_args$args;
        }
        location / { return 404; }
        proxy_method GET;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host 127.0.0.1:5191;
        proxy_set_header Content-Length "";
        proxy_read_timeout 20s;
    }
}
