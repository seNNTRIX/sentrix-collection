<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentriX · 장애 실험실</title>
<style>
:root{color-scheme:light;--ink:#202122;--muted:#60666b;--line:#dedfe1;--paper:white;--blue:#255c91;--mono:ui-monospace,"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;color:var(--ink);background:#fafafa;font:15px/1.5 "Geist","Apple SD Gothic Neo",system-ui,sans-serif;word-break:keep-all}
h1,h2,p,dl,dd{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer}
.bar{height:60px;padding:0 max(24px,calc((100vw - 1120px)/2));background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:19px;font-weight:600;letter-spacing:-.04em}.brand b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#222;color:white;margin-right:8px;font:650 18px system-ui}
a{color:var(--blue);text-underline-offset:3px}.bar a{color:var(--ink);font-size:14px;text-decoration:none}.bar a:hover{text-decoration:underline}
main{max-width:1168px;margin:32px auto;padding:0 24px}.heading{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:24px;letter-spacing:-.02em;line-height:1.25}#site{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel{padding:28px;min-width:0}form.panel{border-right:1px solid var(--line)}h2{font-size:16px;letter-spacing:-.025em;margin-bottom:24px}
fieldset{border:0;padding:0;margin:0;min-width:0}legend,label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.faults{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.faults button,select{border:1px solid #ccced1;background:white;border-radius:5px;text-align:left;min-height:42px;padding:8px 12px}
.faults button{display:flex;align-items:center;gap:10px}.faults button:before{content:"";width:12px;height:12px;border-radius:50%;border:1px solid #a2a5a7}
.faults button[aria-pressed=true]{background:#f6f7f8;border-color:#46494b;font-weight:600}.faults button[aria-pressed=true]:before{border:4px solid #303437;box-sizing:border-box;width:14px;height:14px}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.selects{display:grid;gap:16px}select{width:100%;font:14px var(--mono)}
.config{display:block;margin:20px 0 12px;color:var(--muted);font-size:13px}.primary{width:100%;border:0;border-radius:5px;background:#202122;color:white;min-height:44px;font-weight:650}
button:disabled,select:disabled{cursor:default}.primary:disabled{background:#e9eaec;color:#50555a}.busy:before{content:"";display:inline-block;width:12px;height:12px;border:2px solid #b1b5b8;border-top-color:#40464c;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:turn .8s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.busy:before{animation:none}}
#phase{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}#phase[data-alarm=true]{color:#b7353b}
progress{display:block;width:100%;height:4px;accent-color:var(--blue);margin:0 0 12px}
.row{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
dt,#hint{color:var(--muted)}dd{overflow-wrap:anywhere;word-break:normal;font-variant-numeric:tabular-nums}#hint{font-size:14px}
#notice{color:#a73437;font-size:14px;margin-top:8px}#notice:empty{display:none}#resultLink{display:inline-block;margin-top:18px}
@media(max-width:720px){main{margin:24px auto;padding:0 16px}.bar{height:52px;padding:0 16px}.grid{grid-template-columns:1fr}form.panel{border-right:0;border-bottom:1px solid var(--line)}.panel{padding:20px}h1{font-size:24px}.row{grid-template-columns:80px 1fr}}
.stages{list-style:none;padding:0;margin:16px 0 20px;border-block:1px solid var(--line)}
.stages li{display:grid;grid-template-columns:12px minmax(64px,1fr) minmax(64px,auto);align-items:center;gap:12px;padding:8px 0;font-size:13px}
.stages li+li{border-top:0}.stages li{position:relative}.stages li:not(:last-child)::after{content:"";position:absolute;left:4px;top:calc(50% + 6px);height:calc(100% - 12px);width:1px;background:var(--line)}.stages li::before{content:"";width:8px;height:8px;border:1px solid #b3b6ba;border-radius:50%}
.stages li[data-state="complete"]::before{background:var(--ink);border-color:var(--ink)}
.stages li[data-state="active"]::before{border:2px solid var(--blue)}.stages li[data-state="alarm"]::before{background:#b7353b;border-color:#b7353b}
.stages span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.row dd{min-width:0}.selects select{font-family:inherit}.config,#phase,time,.primary{font-variant-numeric:tabular-nums}.stages span:last-child{font-size:13px}
#details:empty,#hint:empty{display:none}#details .row:last-child{border:0}
@media(max-width:720px){.grid[data-running="true"] [aria-label="최근 실행"]{order:-1;border-bottom:1px solid var(--line)}.grid[data-running="true"] form.panel{border-bottom:0}}
</style>
<div id="operator" hidden>
<nav class="bar"><span class="brand"><b aria-hidden="true">X</b>SentriX</span><a href="/display" target="_blank" rel="noopener">대시보드 열기 ↗</a></nav>
<main><div class="heading"><h1>장애 실험실</h1><span id="site"></span></div>
<div class="grid"><form id="form" class="panel"><h2>실험 설정</h2>
<fieldset id="fields"><legend>장애 유형</legend><div class="faults">
<button type="button" data-fault="network_delay">네트워크 지연</button><button type="button" data-fault="packet_loss">패킷 손실</button>
<button type="button" data-fault="cpu_saturation">CPU 포화</button><button type="button" data-fault="pod_failure">Pod 중단</button></div>
<div class="selects"><div id="from"><label for="source">호출 출발 서비스</label><select id="source"></select></div>
<div><label id="toLabel" for="dest">호출 도착 서비스</label><select id="dest"></select></div></div>
<span class="config" id="availability" aria-live="polite"></span><button id="start" class="primary" disabled>장애 주입</button></fieldset>
<p id="notice" role="alert"></p></form>
<section class="panel" aria-label="최근 실행"><h2>최근 실행</h2><p id="phase" role="status">연결 중</p><progress id="progress" aria-label="주입 경과 시간" hidden></progress><p id="hint"></p><ol id="stages" class="stages" aria-label="실험 진행 단계" hidden></ol><dl id="details"></dl><a id="resultLink" href="/display" target="_blank" rel="noopener" hidden>원인 분석 열기 ↗</a></section></div></main></div>
<script>
const $ = id => document.getElementById(id);
$('operator').hidden=false;
if(location.port==='5190'&&['localhost','127.0.0.1'].includes(location.hostname)){
 $('site').textContent='맥북 로컬 · ';
 const exhibit=document.createElement('a');exhibit.href='http://127.0.0.1:5191/';exhibit.textContent='시드니 전시 실험실 열기';$('site').append(exhibit);
}else if(location.port==='5191')$('site').textContent='시드니 전시';
const decisions = {NORMAL:'정상',ANOMALY:'이상 감지',ABSTAIN:'판정 보류'};
const buttons = selector => Array.from(document.querySelectorAll(selector));
let catalog, fault='network_delay', last={}, sending=false, connected=false;
function options(select,names){
 const current=select.value;
 select.replaceChildren(...names.map(name=>new Option(name,name)));
 if(names.includes(current))select.value=current;
}
function choose(reset=false){
 if(!catalog)return;
 const edge=['network_delay','packet_loss'].includes(fault);
 $('from').hidden=!edge;
 $('toLabel').textContent=edge?'호출 도착 서비스':'대상 서비스';
 options($('source'),edge?Object.keys(catalog.edges):[]);
 const profile=catalog.profiles[fault];
 if(reset&&edge)$('source').value=profile.source;
 options($('dest'),edge?catalog.edges[$('source').value]||[]:catalog.services);
 if(reset)$('dest').value=profile.target;
 $('availability').textContent=profile.condition+' · '+catalog.durationSeconds/60+'분 후 자동 해제';
 for(const b of buttons('[data-fault]')) b.setAttribute('aria-pressed',b.dataset.fault===fault);
 lockInputs();
}
function lockInputs(){
 const locked=sending || !connected || last.phase==='running';
 $('fields').disabled=locked;
 $('start').disabled=locked || !$('dest').value;
 let caption='장애 주입';
 if(!connected)caption='실험실 연결 확인 중';
 else if(sending)caption='주입 요청 중';
 else if(last.phase==='running'){
  const remaining=last.applied?Math.max(0,catalog.durationSeconds-Math.floor((Date.now()-Date.parse(last.applied))/1000)):null;
  if(last.recovered)caption='마지막 분석 구간 확인 중';
  else if(remaining===0)caption='주입 해제 확인 중';
  else if(remaining===null)caption='실험 준비 중';
  else caption='주입 해제까지 '+Math.floor(remaining/60)+'분 '+String(remaining%60).padStart(2,'0')+'초';
 }
 $('start').textContent=caption;
 $('start').classList.toggle('busy',sending||!connected||(last.phase==='running'&&!last.applied));
 $('start').setAttribute('aria-busy',String(locked));
 const progress=$('progress');
 progress.hidden=!last.applied||!!last.recovered||last.phase!=='running'||!catalog;
 if(!progress.hidden){
  progress.max=catalog.durationSeconds;
  progress.value=Math.min(progress.max,Math.max(0,(Date.now()-Date.parse(last.applied))/1000));
 }

}
const pretty = s => s?.replaceAll('->',' → ');
const reasons = {INSUFFICIENT_METRIC_SAMPLES:'30초 동안 수집된 지표가 부족합니다.',TRACE_PARENT_UNAVAILABLE:'호출 관계를 복원할 trace 표본이 부족합니다.',INSUFFICIENT_OPERATIONAL_COVERAGE:'서비스 영향을 확인할 표본이 부족합니다.',TELEMETRY_UPSTREAM_ERROR:'관측 데이터를 제시간에 가져오지 못했습니다.'};
const clock = value => new Date(value).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
function renderStages(s){
 const list=$('stages');
 list.hidden=!s.started;
 if(list.hidden)return;
 const running=s.phase==='running';
 const steps=[
  ['실험 요청','complete',clock(s.started)],
  ['클러스터 주입',s.applied?'complete':running?'active':'',s.applied?clock(s.applied):running?'확인 중':'미확인'],
  ['모델 관측',s.job?'alarm':running?'active':'',s.job&&s.detected?clock(s.detected):s.job?'이상 감지':s.windowsChecked?s.windowsChecked+'개 구간 확인':running?'분석 대기':'판정 없음'],
  ['주입 해제',s.recovered?'complete':'',s.recovered?clock(s.recovered):running?'대기':'미확인']
 ];
 list.replaceChildren(...steps.map(([title,state,value])=>{
  const item=document.createElement('li');
  item.dataset.state=state;
  for(const text of [title,value]){const label=document.createElement('span');label.textContent=text;item.append(label);}
  return item;
 }));
}
function render(s){
 if(s.phase==='running' && s.run!==last.run && catalog?.profiles[s.fault]){
  fault=s.fault;
  const [first,second]=s.location.split('->');
  choose();
  if(second){$('source').value=first;choose();}
  $('dest').value=second||first;
 }
 last=s;
 if(s.mode==='replay')s={phase:'idle'};
 document.querySelector('.grid').dataset.running=String(s.phase==='running');
 renderStages(s);
 const decision=decisions[s.decision], first=s.candidates?.[0];
 const firstName=first && (first.kind==='EDGE'?first.source+' → '+first.target:first.service);
 let status=s.step||'요청 접수';
 if(s.phase==='idle')status='실험 대기';
 else if(s.phase==='failed')status='실험 확인 필요';
 else if(s.detected||s.job)status='이상 감지';
 else if(s.phase==='done')status=!s.applied?'주입 미확인':s.normalWindows?'이상 미감지':'판정 자료 부족';
 else if(s.recovered)status='마지막 판정 대기';
 else if(s.applied)status='주입 중 · 모델 관측 중';
 if($('phase').textContent!==status)$('phase').textContent=status;
 $('phase').dataset.alarm=String(Boolean(s.job));
 $('hint').textContent=s.phase==='running'&&s.applied&&!s.job&&!s.recovered?'30초 구간별로 분석합니다.':'';
 const result=s.job&&s.link?new URL(s.link,location.origin):null;
 $('resultLink').hidden=!result;
 if(result)$('resultLink').href='/display?environment=1'+result.hash;
 const fields=[['실험 유형',s.label],['주입 대상',pretty(s.location)],
 ['주입 전 판정',decisions[s.before]],['최근 판정',!s.job&&decision],
 ['판정 내역',s.windowsChecked?'정상 '+(s.normalWindows||0)+' · 보류 '+(s.abstainedWindows??'—')+' · 이상 '+(s.anomalyWindows??'—'):null],['모델 1순위',firstName],['주입 대상 순위',s.locationRank?s.locationRank+'위':first?'후보 밖':null],
 ['상세',s.message || reasons[s.reason] || (s.reason!=='COMPLETED'&&s.reason)]];
 $('details').replaceChildren(...(s.phase==='idle'?[]:fields).filter(([,v])=>v).map(([k,v])=>{
  const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');
  row.className='row';dt.textContent=k;dd.textContent=v;row.append(dt,dd);return row;
 }));
 lockInputs();
}
async function poll(){
 try{
  if(!catalog){const r=await fetch('/catalog');if(!r.ok)throw Error();const data=await r.json();if(!data.profiles)throw Error();catalog=data;
   choose(true);}
  const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error();
  connected=true;render(await r.json());
 }catch{connected=false;$('phase').textContent='실험실 재연결 중';$('hint').textContent=last.run?'마지막으로 확인한 실행 상태입니다.':'';lockInputs();}
 setTimeout(poll,1200);
}
for(const b of buttons('[data-fault]')) b.onclick=()=>{fault=b.dataset.fault;$('source').replaceChildren();$('dest').replaceChildren();choose(true);};
$('source').onchange=()=>choose();
$('dest').onchange=()=>choose();
$('form').onsubmit=async e=>{
 e.preventDefault();if(!connected || sending || last.phase==='running' || !$('dest').value)return;
 sending=true;lockInputs();$('notice').textContent='';
 try{
  const r=await fetch('/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'live',case:fault,source:$('source').value,target:$('dest').value})});
  if(!r.ok)throw Error(r.status===409?'진행 중인 실험이 있습니다.':r.status===400?await r.text():'실험 요청에 실패했습니다.');
  render(await (await fetch('/state')).json());
 }catch(err){$('notice').textContent=err.message;}finally{sending=false;lockInputs();}
};
poll();
</script></html>
