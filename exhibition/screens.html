<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Boutique · 장애 실험 재생</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f7;color:#19251e;font-family:system-ui,sans-serif}main{width:min(760px,92vw);margin:8vh auto}h1{font-size:clamp(30px,5vw,54px);letter-spacing:-.07em;margin:20px 0 8px}p{line-height:1.6;color:#46594c}button{background:white;color:inherit;text-align:left;border:1px solid #cad3cb;border-radius:8px;padding:19px;font:600 19px system-ui;cursor:pointer}button:hover,button:focus-visible{border-color:#216646;background:#ecf5ef}button:disabled{opacity:.6;cursor:wait}small{display:block;margin-top:6px;font:14px system-ui;color:#526459}#choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px;margin:24px 0}header{padding:12px 20px;background:#18271e;color:white;display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}#out{font-size:clamp(17px,2vw,28px);font-weight:600}#display{height:100dvh;display:flex;flex-direction:column}iframe{width:100%;min-height:0;flex:1;border:0;background:white}#display[hidden],main[hidden]{display:none}a{color:#215a3e}
</style>
<main id="visitor" hidden><small>Online Boutique · 졸업전시</small><h1>장애 실험을 골라 보세요</h1>
<p>리눅스 쇼핑몰에서 수집한 실제 실험 기록입니다. 선택하면 모델이 해당 30초 구간을 다시 분석합니다. 결과는 큰 화면에서 확인하세요.</p>
<div id="choices"><button data-case="network_delay">네트워크 지연<small>화면 서비스 → 상품 서비스</small></button><button data-case="pod_failure">결제 Pod 중단<small>결제 서비스</small></button><button data-case="cpu_saturation">CPU 포화<small>통화 변환 서비스</small></button><button data-case="packet_loss">패킷 손실<small>추천 서비스 → 상품 서비스</small></button></div>
<p id="note" role="status"></p><a href="/display" target="_blank" rel="noopener">큰 모니터 화면 열기 ↗</a></main>
<section id="display" hidden><header><span>Online Boutique · 저장 실험 재분석</span><span id="out" role="status"></span></header><iframe id="frame" title="SentriX 대시보드"></iframe></section>
<script>
const big=location.pathname==='/display';
document.querySelector(big?'#display':'#visitor').hidden=false;
const home='http://127.0.0.1:5177/#B1-Overview';
const frame=document.getElementById('frame'),note=document.getElementById('note'),out=document.getElementById('out');
const buttons=[...document.querySelectorAll('button')];
const decisions={NORMAL:'정상',ANOMALY:'이상 감지',ABSTAIN:'판정 보류'};
let target='',sending=false;
function showFrame(url){if(big&&url!==target){target=url;frame.src=url;}}
function render(s){
 buttons.forEach(b=>b.disabled=sending||s.phase==='running');
 if(s.phase==='idle'){note.textContent='실험 선택 대기';out.textContent='맥북에서 실험을 선택하세요';showFrame(home);return;}
 if(s.phase==='failed'){note.textContent=s.message;out.textContent=s.message;showFrame(home);return;}
 if(s.phase==='running'){note.textContent=s.label+' · 분석 요청 중';out.textContent='저장된 관측 자료를 분석하고 있습니다';showFrame(home);return;}
 const first=s.candidates?.[0],where=first?(first.kind==='EDGE'?first.source+' → '+first.target:first.service):'';
 const message=(decisions[s.decision]||s.decision)+(where?' · 1순위 '+where:'');
 const rank=s.locationRank?' · 주입 위치가 전체 후보 '+s.locationRank+'위':s.decision==='ANOMALY'?' · 주입 위치가 후보에 없음':'';
 note.textContent=s.label+' 실험 · 모델 판정 '+message+rank;out.textContent=message;showFrame(s.link);
}
async function poll(){
 try{const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error();render(await r.json());}
 catch{note.textContent=out.textContent='전시 서버 연결을 확인하세요';buttons.forEach(b=>b.disabled=true);}
 setTimeout(poll,1100);
}
for(const b of buttons)b.onclick=async()=>{
 sending=true;buttons.forEach(x=>x.disabled=true);
 try{const r=await fetch('/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:b.dataset.case})});
 note.textContent=r.ok?'분석 요청을 보냈습니다':r.status===409?'다른 실험을 분석하고 있습니다':'분석 요청을 확인하세요';}
 catch{note.textContent='전시 서버에 연결하지 못했습니다';}finally{sending=false;}
};
poll();
</script></html>
