apiVersion: apps/v1
kind: Deployment
metadata:
  name: currencyservice
  namespace: sentrix
spec:
  template:
    spec:
      containers:
        - name: server
          imagePullPolicy: Never
          livenessProbe: {timeoutSeconds: 8, periodSeconds: 30, failureThreshold: 5}
          readinessProbe: {timeoutSeconds: 5, periodSeconds: 15, failureThreshold: 3}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: sentrix
spec:
  template:
    spec:
      containers:
        - name: server
          startupProbe: {periodSeconds: 10}
          livenessProbe: {timeoutSeconds: 8, periodSeconds: 30, failureThreshold: 5}
          readinessProbe: {timeoutSeconds: 5, periodSeconds: 15, failureThreshold: 3}
