# Applied after deploy/prometheus/values-minimal.yaml.
server:
  retention: 1h
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 512Mi

# Keep frequent container samples for the 30-second model window. The
# control-plane and Prometheus self metrics are outside its feature set.
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  prometheus:
    scrape_interval: 60s
    scrape_timeout: 10s
  kubernetes-service-endpoints:
    scrape_interval: 10s
    scrape_timeout: 8s
  kubernetes-nodes-cadvisor:
    scrape_interval: 5s
    scrape_timeout: 5s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_(receive|transmit)_packets(_dropped)?_total'
        action: keep
