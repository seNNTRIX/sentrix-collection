# Startup grace for AMD64 images emulated on Apple Silicon.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
spec:
  template:
    spec:
      containers:
        - name: server
          startupProbe: {"grpc": {"port": 9555, "service": ""}, "periodSeconds": 5, "timeoutSeconds": 5, "failureThreshold": 60}
          livenessProbe: {timeoutSeconds: 5}
          readinessProbe: {timeoutSeconds: 5}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
spec:
  template:
    spec:
      containers:
        - name: server
          startupProbe: {"grpc": {"port": 7070, "service": ""}, "periodSeconds": 5, "timeoutSeconds": 5, "failureThreshold": 60}
          livenessProbe: {timeoutSeconds: 5}
          readinessProbe: {timeoutSeconds: 5}
          # .NET 8 AMD64 JIT workaround for Rosetta (dotnet/runtime#106819).
          env:
            - name: DOTNET_EnableWriteXorExecute
              value: "0"
---
